<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181715" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Budjet" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/favicon.svg" />
    <title>BudjetKeeper</title>
    <script>
      // apply the saved theme before first paint (see src/lib/theme.ts)
      try {
        var t = localStorage.getItem('bk.theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = t === 'dark' ? '#181715' : '#faf9f5'
          })
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
